<title>니트 베스트 & 가디건 | CLIFFORD SHOP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #222; background: #fff; }
.site-header { max-width: 1240px; margin: 0 auto; padding: 50px 20px 20px; text-align: center; }
.site-logo { max-width: 280px; height: auto; }
.nav-bar { max-width: 1240px; margin: 0 auto; display: flex; justify-content: flex-end; gap: 30px; padding: 16px 20px; border-bottom: 1px solid #222; font-size: 14px; letter-spacing: 1px; }
.nav-bar a { text-decoration: none; color: #333; }
.category-title { max-width: 1240px; margin: 30px auto 0; padding: 0 20px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.product-grid { max-width: 1240px; margin: 20px auto 60px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 50px 30px; padding: 0 20px; }
.product-card { cursor: pointer; color: inherit; text-decoration: none; display: block; }
.product-image { width: 100%; aspect-ratio: 1 / 1; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #f2f2f2; margin-bottom: 14px; }
.product-name { font-size: 14px; color: #222; margin-bottom: 6px; }
.product-price { font-size: 13px; color: #666; }
@media (max-width: 900px) {
  .product-grid { grid-template-columns: repeat(2, 1fr); gap: 36px 20px; }
}
@media (max-width: 560px) {
  .site-header { padding: 30px 16px 16px; }
  .nav-bar { gap: 16px; padding: 12px 16px; font-size: 12px; justify-content: center; }
  .category-title { padding: 0 16px; }
  .product-grid { grid-template-columns: 1fr; gap: 30px; padding: 0 16px; margin: 20px auto 40px; }
}
</style>
</head>
